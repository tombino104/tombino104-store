version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-vibravid_web_1
      APP_PORT: 8000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/astraelabs/vibravid:latest@sha256:442d99134a006ae31c63d5e99791a0741e5b7ad4f4e26cec36e622c57066d6ba
    restart: on-failure
    stop_grace_period: 10s
    environment:
      ALLOWED_HOSTS: "*"
      CSRF_TRUSTED_ORIGINS: "http://umbrel.local:8000,http://192.168.1.3:8000"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/VibraVid:/app/Video
      - ${APP_DATA_DIR}/data/db:/app/data
      - ${APP_DATA_DIR}/data/logs:/app/logs
      - ${APP_DATA_DIR}/data/config:/app/Conf
