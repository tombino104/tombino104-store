manifestVersion: 1
id: tombino104-homelab-savings

category: finance
name: Homelab Savings
version: "0.2.0"
tagline: What does your homelab save you?
description: >-
  A tiny calculator for how much money your homelab saves you. List the services you
  self-host and what their cloud equivalents would cost, add the electricity, the
  hardware and any other cost, and see the net savings per month and per year, and the
  month the hardware pays for itself.


  It comes with a small catalog of common self-hosted services with rough example
  prices that you can edit. No accounts, no cloud, no tracking: your numbers are kept
  in one small file on your Umbrel. The whole app is a single tiny binary that uses a
  few megabytes of memory.
developer: tombino104
website: https://github.com/tombino104/homelab-savings
