version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-homelab-savings_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/homelab-savings:0.2.0@sha256:3627e5c53a2b78e518a5472f50f0f84191cc7031d09d60e5bc225f1faac2c3b2
    restart: on-failure
    stop_grace_period: 10s
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
