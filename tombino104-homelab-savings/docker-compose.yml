version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-homelab-savings_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/homelab-savings:0.3.0@sha256:c0a82aef53b2ec0d9d80db82e58833219b963da4a1bcb006e0d632bec9b45e21
    restart: on-failure
    stop_grace_period: 10s
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
