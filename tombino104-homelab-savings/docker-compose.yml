version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-homelab-savings_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/homelab-savings:0.5.0@sha256:92b8bce577da06b6b7984a09cc82424946af6453e57bc62e94462df96af774b0
    restart: on-failure
    stop_grace_period: 10s
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
