version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-homelab-savings_web_1
      APP_PORT: 3000

  web:
    image: ghcr.io/tombino104/homelab-savings:0.4.0@sha256:7fbf0e0729890d97c9352d0db0cc27b1c2b776d725a81d9549da2d3dd0efe064
    restart: on-failure
    stop_grace_period: 10s
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
