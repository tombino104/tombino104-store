manifestVersion: 1
id: tombino104-upersite-crm
folderAccess:
  - id: backup-folder
    name: Backup folder
    note: Pick a folder (Home, an external drive or a network share). In the CRM, open Settings → Backup and data → Browse… and choose it under /cartelle. Without this, backups go to the app's own /backups folder.
    mounts:
      - service: web
        targetPath: /cartelle
category: productivity
name: Upersite CRM
version: "2.0.4-stable"
tagline: "Clients, quotes, payments, tasks and automations"
icon: https://raw.githubusercontent.com/tombino104/tombino104-store/main/tombino104-upersite-crm/icon.svg
description: >-
  Upersite CRM is the self-hosted CRM of Upersite Studio: clients on a Kanban board,
  quotes, instalments and due dates, tasks with priorities and a calendar, notes,
  tickets and timesheets, encrypted client credentials, a built-in quote calculator
  and a node-based editor for automations. Optional AI features can use a local or
  cloud model.


  The first time you open it, create the master password. Data is encrypted on disk
  with a key derived from this app's secret on your Umbrel. Backups go to the app's
  /backups folder by default; to save them somewhere else (Home, an external drive,
  a network share), choose a folder in the app's settings on Umbrel and pick it in the
  CRM from Settings → Backup and data → Browse…. Keep a recent backup outside Umbrel too.
developer: Upersite Studio
website: https://github.com/tombino104/Upersite-CRM
dependencies: []
repo: https://github.com/tombino104/Upersite-CRM
support: https://github.com/tombino104/Upersite-CRM/issues
port: 8481
gallery: []
path: ""
releaseNotes: ""
