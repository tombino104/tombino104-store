version: "3.7"

x-crm-image: &crm-image
  image: ghcr.io/tombino104/upersite-crm:2.0.4-stable@sha256:8fe16f8fdb675a51806484695664538a8ce41633b8555641b0ee17771a313113

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-upersite-crm_web_1
      APP_PORT: 3000

  # One-shot: the CRM runs as the non-root user "node" and must own its data folders.
  init:
    <<: *crm-image
    user: "0"
    entrypoint: ["sh", "-c", "mkdir -p /data /backups && chown -R node:node /data /backups"]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/backups:/backups

  web:
    <<: *crm-image
    restart: on-failure
    stop_grace_period: 20s
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      # Encrypts the data on disk. It is derived from this app's Umbrel secret: keep your own
      # backups, because the data cannot be read without this key.
      CRM_ENCRYPTION_KEY: ${APP_SEED}
      # Behind Umbrel's proxy: the login rate limit must count the real client, not the proxy.
      CRM_TRUST_PROXY: "1"
      CRM_SESSION_HOURS: "12"
      # Tells the app where its folders are on your Umbrel (shown next to the paths in Settings).
      CRM_PATH_HINTS: "/data=Apps/tombino104-upersite-crm/data/data;/backups=Apps/tombino104-upersite-crm/data/backups"
      TZ: Europe/Rome
    volumes:
      - ${APP_DATA_DIR}/data/data:/data
      - ${APP_DATA_DIR}/data/backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
