id: tombino104-nduja-simulator
category: social
name: "'Nduja Simulator"
version: "2026.11.28"
tagline: "Eat, fight the horses, clear the dungeon. Multiplayer arena included."
description: >-
  A 3D first-person game set in Peppino's salumeria. Story, endless and dungeon modes, plus a
  free-for-all PvP arena with katana, lupara, chili launcher and more: share an arena code with friends
  and play together in the browser, on desktop or phone. The Elo leaderboard is kept on your Umbrel.


  No accounts, no tracking. The app is a tiny Node.js server (a few megabytes of memory) that serves the
  game and relays the arena over WebSocket; ratings are stored in one small SQLite file.
  To play from outside your home, point a Cloudflare Tunnel (or any reverse proxy that supports WebSockets)
  at this app.
