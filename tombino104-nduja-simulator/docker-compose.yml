version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-nduja-simulator_web_1
      APP_PORT: 3000
      # The game has no accounts and is meant to be shared with friends: skip Umbrel's login in front of it.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/tombino104/nduja-simulator:latest@sha256:594883cec72d55c34db1dc0934548c99b5890b54757ba9d4df2cef18767739f9
    restart: on-failure
    stop_grace_period: 10s
    environment:
      PORT: 3000
      DATA_DIR: /data
    volumes:
      - ${APP_DATA_DIR}/data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
