manifestVersion: 2.0
id: tombino104-taskhit
storage:
  dataRoot: data
category: productivity
name: TaskHit
version: "0.1.1"
tagline: Il calendario condiviso della classe
description: >-
  Al primo avvio apri l'app dalla rete di casa e crea l'account amministratore: il setup è bloccato per chi arriva dal tunnel Cloudflare finché non lo abiliti nella configurazione.


  TaskHit è un calendario scolastico condiviso: eventi pubblici per tutta la classe, eventi privati cifrati sul tuo dispositivo, inbox delle modifiche, ruoli con approvazione e temi personalizzabili.


  La password non lascia mai il dispositivo. Conserva la chiave di recupero che ti viene mostrata alla creazione dell'account: senza di essa e senza la password i dati privati non sono recuperabili.
releaseNotes: "Nuovo logo e nuove icone dell'app."

