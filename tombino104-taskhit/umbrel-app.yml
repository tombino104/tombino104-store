manifestVersion: 2.0
id: tombino104-taskhit
folderAccess:
  - id: backup-folder
    name: Cartella per le copie dei backup
    note: >-
      Facoltativa. Scegli una cartella (in Home, su un disco esterno o in rete): ogni backup di TaskHit
      vi viene anche copiato, e resta se disinstalli l'app. I file contengono tutti i dati: scegli una
      cartella privata.
    mounts:
      - service: web
        targetPath: /copie
storage:
  dataRoot: data
category: productivity
name: TaskHit
version: "0.7.0"
tagline: Il calendario condiviso della classe
description: >-
  Serve un indirizzo HTTPS: aperta in http:// l'app non permette di creare account né di accedere. Al primo avvio crea subito l'account amministratore: il setup è bloccato per chi arriva dal tunnel Cloudflare finché non lo abiliti nella configurazione.


  TaskHit è un calendario scolastico condiviso: eventi pubblici per tutta la classe, eventi privati cifrati sul tuo dispositivo, inbox delle modifiche, ruoli con approvazione, temi personalizzabili e backup automatici.


  La password non lascia mai il dispositivo. Conserva la chiave di recupero che ti viene mostrata alla creazione dell'account: senza di essa e senza la password i dati privati non sono recuperabili.
releaseNotes: "App anche in inglese e temi chiari e scuri. Inoltre gruppi di lavoro, accesso con nome e cognome, foto profilo, moderazione ed eventi colorati. Chi aveva un nome utente entra una volta da «Avevi un nome utente?». Account admin e alunno devono avere nomi diversi."

developer: Lorenzo
