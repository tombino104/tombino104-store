version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-taskhit_web_1
      APP_PORT: 8080
      # TaskHit ha il proprio accesso (i compagni entrano dal tunnel senza account Umbrel).
      PROXY_AUTH_ADD: "false"

  web:
    # Immagine fissata per digest: va aggiornata insieme al numero di versione a ogni release.
    image: ghcr.io/tombino104/taskhit:0.8.0@sha256:33b165cf609e6a041eb09eaf634ccc554941e2fb60118fe7ffdf5eabd4a5bb74
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TASKHIT_DATA_DIR: /data
      TASKHIT_COOKIE_SECURE: "true"
      # Seconda copia dei backup: esiste solo se scegli una cartella nelle impostazioni dell'app su Umbrel.
      TASKHIT_BACKUP_COPY_DIR: /copie
      # TASKHIT_PUBLIC_URL: "https://taskhit-tombino104.net"
    volumes:
      - ${APP_DATA_DIR}/data/app:/data
