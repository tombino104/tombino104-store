tagline: "Open source customer support: live chat, email and more"
icon: https://raw.githubusercontent.com/tombino104/tombino104-store/main/tombino104-chatwoot/icon.svg
description: >-
  Chatwoot is an open source customer support desk. Talk to your customers
  from one inbox across live chat, email, social networks and messaging apps.


  It has its own accounts: the first visit asks you to create the administrator.
  Public sign-up is off. Links in emails and chat widgets point to
  umbrel.local, so the app suits teams on your own network. The app needs
  about 2 GB of memory: PostgreSQL, Redis and the Rails and Sidekiq workers run
  inside it.
