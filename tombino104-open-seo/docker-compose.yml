version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-open-seo_web_1
      APP_PORT: 3001

  web:
    image: ghcr.io/every-app/open-seo:0.1.32@sha256:a4a5689b5e10d3a7842564d32e40e31d2e198884f4e292680062e1e6b6ebdf40
    restart: on-failure
    stop_grace_period: 30s
    # Optional API keys (DATAFORSEO_API_KEY=..., OPENROUTER_API_KEY=...): see the app description.
    env_file:
      - path: ${APP_DATA_DIR}/data/openseo.env
        required: false
    environment:
      CLOUDFLARE_INCLUDE_PROCESS_ENV: "true"
      PORT: 3001
      # Umbrel's own login (app_proxy) already protects the app, so OpenSEO runs without its own sign-in.
      AUTH_MODE: local_noauth
      BETTER_AUTH_SECRET: ${APP_SEED}
      OPENSEO_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      VITE_SHOW_DEVTOOLS: "false"
    volumes:
      - ${APP_DATA_DIR}/data/wrangler:/app/.wrangler
