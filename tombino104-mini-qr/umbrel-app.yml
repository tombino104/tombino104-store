tagline: Create and scan cute QR codes
icon: https://raw.githubusercontent.com/tombino104/tombino104-store/main/tombino104-mini-qr/icon.svg
description: >-
  MiniQR is a small web app to create and scan QR codes. Make codes for links,
  text, Wi-Fi networks and more, customize colors, dots, corners and logos, and
  download them as PNG, SVG or JPG. You can also scan a QR code from an image
  or the camera.


  Everything runs in your browser: nothing you type is sent anywhere, and the
  app keeps no data on your Umbrel.
