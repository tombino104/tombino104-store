version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tombino104-hycanvas_app_1
      APP_PORT: 8005
      # HyCanvas has its own accounts: the first one you create is the admin.
      PROXY_AUTH_ADD: "false"

  # One-shot: the app runs as uid 10001 and needs to own its storage folder.
  storage-init:
    image: hycanvas/hycanvas:0.3.24@sha256:19054aac95d4364ff5e99883612535092706f0fd58db765699f117d7389b7beb
    user: "0"
    entrypoint: ["sh", "-c", "mkdir -p /app/.data/storage && chown -R 10001:0 /app/.data/storage"]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/.data/storage

  app:
    image: hycanvas/hycanvas:0.3.24@sha256:19054aac95d4364ff5e99883612535092706f0fd58db765699f117d7389b7beb
    restart: on-failure
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "8005"
      DB_AUTO_MIGRATE: "true"
      # Umbrel serves apps over plain http on the local network: secure cookies would break login.
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://postgres:${APP_SEED}@db:5432/hycanvas?schema=public
      JWT_SECRET: ${APP_SEED}
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8477
      REDIS_URL: ""
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/.data/storage
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/.data/storage

  db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${APP_SEED}
      POSTGRES_DB: hycanvas
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hycanvas"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
